# Xatu Analysis Dashboard Configuration
# This file contains the default configuration for the application
# User-specific overrides should be placed in config.local.yaml

# ClickHouse cluster definitions
# Credentials are pulled from environment variables:
# - {cluster_name}_CLICKHOUSE_USERNAME
# - {cluster_name}_CLICKHOUSE_PASSWORD
clickhouse:
  clusters:
    xatu:
      host: clickhouse.xatu.ethpandaops.io
      port: 443
      database: default
      protocol: https
      # Credentials from env: XATU_CLICKHOUSE_USERNAME, XATU_CLICKHOUSE_PASSWORD
      description: "Main Xatu ClickHouse cluster"
    experimental:
      host: clickhouse.xatu-experimental.ethpandaops.io
      port: 443
      database: default
      protocol: https
      # Credentials from env: EXPERIMENTAL_CLICKHOUSE_USERNAME, EXPERIMENTAL_CLICKHOUSE_PASSWORD
      description: "Experimental Xatu ClickHouse cluster"
    sunnyside:
      host: 94.130.19.237
      port: 8123
      database: default
      protocol: http
      # Credentials from env: SUNNYSIDE_CLICKHOUSE_USERNAME, SUNNYSIDE_CLICKHOUSE_PASSWORD
      description: "Sunnyside ClickHouse cluster"
  # Default cluster to use if not specified
  default_cluster: xatu
  
  # Network discovery configuration
  network_discovery:
    enabled: true
    # Tables to query for available networks
    tables:
      - canonical_beacon_block
      - libp2p_gossipsub_beacon_block
      - beacon_api_eth_v1_events_block
    # Number of days to look back for network discovery
    lookback_days: 7
    # Cache discovered networks for this duration (minutes)
    cache_duration: 60

# Network configurations
